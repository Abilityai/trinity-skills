# catalog.yaml — machine-readable self-description of this repository.
# Consumers (Trinity skill_service, UIs, other runtimes) read this instead of
# assuming harness conventions. Platform side: trinity-enterprise#332.
schema_version: 1
skills_root: skills/

categories:   # every skill's `category:` frontmatter comes from this enum
  agent-development: "Skills that build or extend agents and fleets"
  visual-communication: "Documents, decks, pages, diagrams, images"
  documents-and-data: "Extraction, indexing, transformation of files and data"
  research-and-analysis: "Gathering and judging external information"
  workspace: "Git, hygiene, self-diagnostics, skill authoring"
  project-management: "Backlogs, task registries and the project lifecycle — GitHub Issues as the shared ledger"

providers:    # canonical env key per credential provider (rules in CONTRIBUTING.md)
  github: GITHUB_TOKEN
  google-gemini: GEMINI_API_KEY
  replicate: REPLICATE_API_TOKEN
  elevenlabs: ELEVENLABS_API_KEY
  vercel: VERCEL_TOKEN
  nevermined: NVM_API_KEY

sets:         # named slices of THIS source, assignable to an agent as one unit (trinity-enterprise#530)
  architect:                  # the resident Architect's skill set — holds a fleet to its target view (schema + views: Abilityai/fleet-targets)
    skills: [reconcile-fleet, compile-view, apply-view]
    requires: {env: [GITHUB_TOKEN]}
    schedules:                # SUGGESTED only — the platform shows them, never creates them
      - {name: Architect tick, cron: "0 6 * * *", message: /reconcile-fleet}
