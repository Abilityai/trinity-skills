<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem("ab-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
:root{color-scheme:dark; --bg:#0B0B0E; --bg-1:#131318; --line:#34343C; --ink:#FFFFFF; --ink-dim:#9DA2BC; --ink-mute:#6B6E80; --accent:#B85050; --risk:#FF8FAB}
html[data-theme="light"]{color-scheme:light; --bg:#FAF8F5; --bg-1:#FFFFFF; --line:#D4CFC6; --ink:#1A1A1E; --ink-dim:#4A4C58; --ink-mute:#8A8C99; --risk:#B03050}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 16px; background:var(--bg); color:var(--ink); font-family:'DM Sans',system-ui,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased}
main{width:100%; max-width:520px}
.tag{display:inline-block; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim); border:1px solid var(--line); border-radius:999px; padding:6px 13px; margin-bottom:26px}
.tag i{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:9px; vertical-align:1px}
h1{font-size:clamp(28px,6vw,40px); line-height:1.12; letter-spacing:-.02em; font-weight:800; margin:0 0 14px; text-wrap:balance}
p.lede{color:var(--ink-dim); font-size:17px; margin:0 0 30px}
label{display:block; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-mute); margin-bottom:9px}
.row{display:flex; gap:10px; flex-wrap:wrap}
input{flex:1 1 240px; min-width:0; font:inherit; font-size:17px; color:var(--ink); background:var(--bg-1); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{font:inherit; font-size:16px; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:10px; padding:14px 26px; cursor:pointer}
button[disabled]{opacity:.6; cursor:default}
.err{color:var(--risk); font-size:14.5px; min-height:22px; margin:10px 0 0}
.note{color:var(--ink-mute); font-size:13.5px; margin:18px 0 0}
</style>
</head>
<body>
<main>
  <div class="tag"><i></i>__TAG__</div>
  <h1>__HEAD__</h1>
  <p class="lede">This page was shared privately. Enter your email to open it.</p>
  <form novalidate>
    <label for="em">Work email</label>
    <div class="row">
      <input id="em" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@company.com" required autofocus>
      <button type="submit">Open</button>
    </div>
    <p class="err" role="alert"></p>
  </form>
  <p class="note">We record who opens this page and how long they spend on it.</p>
</main>
<script>
(function(){
  var sid=Math.random().toString(36).slice(2)+Date.now().toString(36), r=null;
  try{r=new URLSearchParams(location.search).get('r'); if(r)localStorage.setItem('ms-r',r); else r=localStorage.getItem('ms-r');}catch(e){}
  function post(path,obj){obj.sid=sid; obj.r=r; obj.ref=document.referrer; obj.vw=innerWidth;
    return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj),keepalive:true});}
  post('/api/t',{type:'gate_view'}).catch(function(){});
  var f=document.querySelector('form'), em=document.getElementById('em'), err=document.querySelector('.err'), btn=f.querySelector('button');
  f.addEventListener('submit',function(e){
    e.preventDefault(); err.textContent='';
    var v=em.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v)){err.textContent='Enter a valid email address.'; em.focus(); return;}
    btn.disabled=true; btn.textContent='Opening';
    post('/api/gate',{email:v}).then(function(res){
      if(res.ok){location.reload(); return;}
      return res.json().catch(function(){return {};}).then(function(j){throw new Error(j.error||'Could not open the page. Try again.');});
    }).catch(function(x){err.textContent=x.message||'Could not open the page. Try again.'; btn.disabled=false; btn.textContent='Open';});
  });
})();
</script>
</body>
</html>
